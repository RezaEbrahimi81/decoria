<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account — Decoria</title>

    <!-- Favicon: brand armchair mark, matches header logo -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/images/logos/favicon.svg"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Theme bootstrap: apply saved theme before first paint (prevents flash) -->
    <script>
      try {
        if (localStorage.getItem("decoria-theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Styles (compiled Tailwind) -->
    <link rel="stylesheet" href="/dist/css/main.css" />
  </head>
  <body data-page="account" class="bg-surface font-sans text-ink">
    <!-- Header mount point (injected by main.js) -->
    <div id="site-header"></div>

    <main>
      <div class="mx-auto max-w-7xl px-4 py-16">
        <h1 class="font-display text-4xl text-primary">Account</h1>
        <!-- product grid → next step -->
      </div>
    </main>

    <!-- Footer mount point -->
    <div id="site-footer"></div>

    <!-- Entry point -->
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
