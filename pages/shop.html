<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — Decoria</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Styles (compiled Tailwind) -->
    <link rel="stylesheet" href="/dist/css/main.css" />
  </head>
  <body data-page="shop" class="bg-surface font-sans text-neutral-900">
    <!-- Header mount point (injected by main.js) -->
    <div id="site-header"></div>
    <main>
      <div class="mx-auto max-w-7xl px-4 py-12">
        <h1 class="font-display text-4xl text-primary">Shop</h1>
        <!-- grid gets filled by JS -->
        <div
          id="product-grid"
          class="mt-8 grid grid-cols-2 gap-x-6 gap-y-10 md:grid-cols-3 lg:grid-cols-4"
        ></div>
      </div>
    </main>

    <!-- Footer mount point -->
    <div id="site-footer"></div>

    <!-- Entry point -->
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
