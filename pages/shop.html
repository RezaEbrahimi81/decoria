<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — Decoria</title>

    <!-- Theme bootstrap: apply saved theme before first paint -->
    <script>
      try {
        if (localStorage.getItem("decoria-theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/images/logos/favicon.svg"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="/dist/css/main.css" />
  </head>
  <body data-page="shop" class="bg-surface font-sans text-neutral-900">
    <!-- Header mount point -->
    <div id="site-header"></div>

    <main class="mx-auto max-w-7xl px-4 py-10">
      <h1 class="font-display text-4xl text-ink">Shop</h1>

      <div
        class="mt-8 grid grid-cols-1 items-start gap-8 lg:grid-cols-[260px_1fr]"
      >
        <!-- ==================== Filters sidebar (desktop) ==================== -->
        <aside
          id="filters"
          class="hidden lg:block sticky top-24 rounded-xl border border-line bg-card p-5"
        >
          <!-- rendered by JS -->
        </aside>

        <!-- ==================== Products area ==================== -->
        <section>
          <!-- toolbar: result count + sort -->
          <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <p id="result-count" class="text-sm text-muted">Loading…</p>

            <label class="flex items-center gap-2 text-sm">
              <span class="text-muted">Sort by</span>
              <select
                id="sort-select"
                class="rounded-lg border border-line bg-card px-3 py-2 text-sm text-ink outline-none focus:border-accent"
              >
                <option value="new">Newest</option>
                <option value="price_asc">Price: Low → High</option>
                <option value="price_desc">Price: High → Low</option>
                <option value="rating_desc">Top Rated</option>
              </select>
            </label>
          </div>

          <!-- mobile: filters toggle -->
          <button
            type="button"
            id="filters-toggle"
            class="mb-4 w-full rounded-lg border border-line bg-card py-2.5 text-sm font-medium text-ink lg:hidden"
          >
            <i class="fa-solid fa-sliders mr-2 text-accent-text"></i>Filters
          </button>
          <div id="filters-mobile" class="mb-6 hidden lg:hidden">
            <div
              id="filters-mobile-body"
              class="rounded-xl border border-line bg-card p-5"
            ></div>
          </div>

          <!-- grid -->
          <div
            id="product-grid"
            class="grid grid-cols-2 gap-x-6 gap-y-10 md:grid-cols-3 xl:grid-cols-3"
          ></div>

          <!-- pagination -->
          <nav
            id="pagination"
            aria-label="Pagination"
            class="mt-12 flex justify-center gap-2"
          ></nav>
        </section>
      </div>
    </main>

    <!-- Footer mount point -->
    <div id="site-footer"></div>

    <!-- Entry point -->
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
