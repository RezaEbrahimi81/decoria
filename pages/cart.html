<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — Decoria</title>

    <!-- Favicon: brand armchair mark, matches header logo -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/images/logos/favicon.svg"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Theme bootstrap: apply saved theme before first paint (prevents flash) -->
    <script>
      try {
        if (localStorage.getItem("decoria-theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Styles (compiled Tailwind) -->
    <link rel="stylesheet" href="/dist/css/main.css" />
  </head>
  <body data-page="cart" class="bg-surface font-sans text-ink">
    <!-- Header mount point (injected by main.js) -->
    <div id="site-header"></div>

    <main class="mx-auto max-w-7xl px-4 py-12">
      <h1 class="font-display text-4xl text-ink">Your Cart</h1>

      <div
        class="mt-8 grid grid-cols-1 items-start gap-10 lg:grid-cols-[1fr_360px]"
      >
        <!-- items rendered by JS -->
        <div
          id="cart-items"
          class="divide-y divide-line rounded-xl border border-line bg-card"
        ></div>

        <!-- summary -->
        <aside class="rounded-xl border border-line bg-card p-6">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-muted">
            Order Summary
          </h2>
          <dl class="mt-4 space-y-3 text-sm">
            <div class="flex justify-between">
              <dt class="text-muted">Subtotal</dt>
              <dd id="cart-subtotal" class="font-semibold text-ink">—</dd>
            </div>
            <div class="flex justify-between">
              <dt class="text-muted">Shipping</dt>
              <dd class="text-muted">Free over €500</dd>
            </div>
          </dl>
          <button
            id="checkout-btn"
            type="button"
            class="mt-6 w-full bg-accent py-3 text-sm font-medium text-accent-fg transition hover:bg-accent-strong disabled:cursor-not-allowed disabled:bg-line disabled:text-muted"
          >
            Proceed to Checkout
          </button>
          <a
            href="/pages/shop.html"
            class="mt-3 block text-center text-sm text-muted transition hover:text-accent-text"
            >Continue shopping</a
          >
        </aside>
      </div>

      <!-- empty state (hidden by default) -->
      <div id="cart-empty" class="hidden py-20 text-center">
        <p class="font-display text-2xl text-ink">Your cart is empty</p>
        <p class="mt-2 text-muted">
          Looks like you haven't added anything yet.
        </p>
        <a
          href="/pages/shop.html"
          class="mt-6 inline-block bg-accent px-8 py-3 text-sm font-medium text-accent-fg transition hover:bg-accent-strong"
          >Browse the shop</a
        >
      </div>
    </main>

    <!-- Footer mount point -->
    <div id="site-footer"></div>

    <!-- Entry point -->
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
