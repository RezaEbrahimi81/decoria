<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — Decoria</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Styles (compiled Tailwind) -->
    <link rel="stylesheet" href="/dist/css/main.css" />
  </head>
  <body data-page="product" class="bg-surface font-sans text-neutral-900">
    <!-- Header mount point (injected by main.js) -->
    <div id="site-header"></div>

    <main>
      <div class="mx-auto max-w-7xl px-4 py-16">
        <h1 class="font-display text-4xl text-primary">Product</h1>
        <!-- product grid → next step -->
      </div>
       <!-- Minimal skeleton: gallery + specs come in the next iterations -->
    <div class="grid grid-cols-1 items-start gap-10 md:grid-cols-2">
      <img id="product-image" alt="" class="aspect-[4/3] w-full rounded bg-white object-cover" />

      <div>
        <p id="product-category" class="text-xs font-semibold uppercase tracking-widest text-neutral-500"></p>
        <h1 id="product-name" class="mt-2 font-display text-4xl text-primary"></p></h1>

        <!-- Price + currency dropdown, modernity-style -->
        <div class="mt-4 flex items-center gap-3">
          <span id="product-price" class="font-display text-3xl text-primary"></span>
          <select id="currency-select" aria-label="Currency"
            class="border border-neutral-300 bg-white px-2 py-1 text-sm outline-none focus:border-accent">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </div>

        <p id="product-description" class="mt-6 leading-7 text-neutral-600"></p>
      </div>
    </div>
    </main>

    <!-- Footer mount point -->
    <div id="site-footer"></div>

    <!-- Entry point -->
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
