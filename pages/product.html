<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — Decoria</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Theme bootstrap: apply saved theme before first paint (prevents flash) -->
    <script>
      try {
        if (localStorage.getItem("decoria-theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Styles (compiled Tailwind) -->
    <link rel="stylesheet" href="/dist/css/main.css" />
  </head>
  <body data-page="product" class="bg-surface font-sans text-ink">
    <!-- Header mount point -->
    <div id="site-header"></div>

    <main class="mx-auto max-w-7xl px-4 py-10">
      <!-- Breadcrumb -->
      <nav aria-label="Breadcrumb" class="text-sm text-muted">
        <a href="/index.html" class="transition hover:text-accent-text">Home</a>
        <span class="mx-2">/</span>
        <a href="/pages/shop.html" class="transition hover:text-accent-text"
          >Shop</a
        >
        <span class="mx-2">/</span>
        <span id="breadcrumb-name" class="text-ink"></span>
      </nav>

      <div class="mt-8 grid grid-cols-1 items-start gap-10 lg:grid-cols-2">
        <!-- ==================== Gallery ==================== -->
        <section aria-label="Product images">
          <!-- main image: swaps when a thumbnail is clicked -->
          <div class="overflow-hidden rounded-xl bg-card shadow-sm">
            <img
              id="gallery-main"
              alt=""
              class="aspect-square w-full object-cover"
            />
          </div>
          <!-- thumbnails are rendered by JS (image count varies per product) -->
          <div id="gallery-thumbs" class="mt-3 flex gap-3"></div>
        </section>

        <!-- ==================== Product info ==================== -->
        <section>
          <p
            id="product-category"
            class="text-xs font-semibold uppercase tracking-widest text-muted"
          ></p>
          <h1
            id="product-name"
            class="mt-2 font-display text-4xl leading-tight text-primary"
          ></h1>

          <!-- rating stars rendered by JS -->
          <div id="product-rating" class="mt-3 flex items-center gap-2"></div>

          <!-- price + currency switcher (EUR / USD) -->
          <div class="mt-5 flex flex-wrap items-baseline gap-3">
            <span
              id="product-price"
              class="font-display text-3xl text-primary"
            ></span>
            <del id="product-oldprice" class="hidden text-lg text-muted"></del>
            <select
              id="currency-select"
              aria-label="Currency"
              class="border border-neutral-300 bg-card px-2 py-1 text-sm outline-none focus:border-accent"
            >
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
            </select>
          </div>

          <p id="product-description" class="mt-6 leading-7 text-ink"></p>

          <!-- specs table (material, dimensions) — rows rendered by JS -->
          <dl
            id="product-specs"
            class="mt-8 divide-y divide-neutral-200 border-y border-neutral-200 text-sm"
          ></dl>

          <!-- stock + CTA -->
          <div class="mt-8 flex flex-wrap items-center gap-4">
            <button
              id="add-to-cart"
              type="button"
              class="bg-accent px-10 py-3.5 text-sm font-medium tracking-wide text-accent-fg transition hover:bg-accent-strong disabled:cursor-not-allowed disabled:bg-line disabled:text-muted disabled:hover:bg-line"
            >
              <i class="fa-solid fa-bag-shopping mr-2"></i>Add to Cart
            </button>
            <span id="product-stock" class="text-sm font-medium"></span>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer mount point -->
    <div id="site-footer"></div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
